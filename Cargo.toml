[workspace]
resolver = "3"
members = [
  "app",
]

default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sisho-cli = { path = "app" }

#= Crates.io
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 3
