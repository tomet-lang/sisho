[workspace]
resolver = "3"
members = [
  "app",
  "crates/sisho-run",
  "crates/sisho-tools",
  "crates/sisho-serve",
  "crates/sisho-sdk",
  "crates/sisho-tui",
]
default-members = ["app"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"

[workspace.dependencies]
sisho-cli   = { path = "app" }
sisho-run   = { path = "crates/sisho-run" }
sisho-sdk   = { path = "crates/sisho-sdk" }
sisho-serve = { path = "crates/sisho-serve" }
sisho-tools = { path = "crates/sisho-tools" }
sisho-tui   = { path = "crates/sisho-tui" }
#--- Tomet ---
tomet-ast         = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-ast-parser  = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-load-config = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-spec        = { git = "https://github.com/tomet-lang/tomet.git" }
#---
jobserver-gate = { git = "https://github.com/tomet-lang/jobserver-gate.git" }
#--- Crates.io ---
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
clap = { version = "4.6", features = ["derive"] }
jobserver = "0.1"
mimalloc = { version = "0.1", default-features = false }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev.package."*"]
opt-level = 3
