[package]
name = "sisho-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orchestrator CLI for the Tomet ecosystem (tomet, twrit, tandr)."
publish = false

[[bin]]
name = "sisho"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:sisho-counter"]

[dependencies]
sisho-counter = { workspace = true, optional = true }
sisho-run = { workspace = true }
sisho-sdk = { workspace = true }
sisho-serve = { workspace = true }
sisho-tools = { workspace = true }
sisho-vault = { workspace = true }

#= Tomet
tomet-load-config = { workspace = true }
tomet-spec = { workspace = true }

#= Crates.io
anyhow = { workspace = true }
clap = { workspace = true }
jobserver = { workspace = true }
mimalloc = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tomet-ast = { workspace = true }
tomet-parser = { workspace = true }
